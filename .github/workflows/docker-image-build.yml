name: Build and Push Docker Images

on:
  push:
    branches:
      ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
  
    steps:
      - uses: actions/checkout@v4
  
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Github container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-ecs-role
          aws-region: ${{ vars.AWS_REGION }}


      - name: Build user_service image
        uses: docker/build-push-action@v6
        with:
          context: ./back_end/
          file: ./back_end/user_service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/user_service:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.sha }}
            ${{ vars.ECR_REPOSITORY }}/ecomm-user-service:latest


      - name: Build products_service image
        uses: docker/build-push-action@v6
        with:
          context: ./back_end/
          file: ./back_end/products_service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/products_service:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.sha }}

      - name: Build cart_service image
        uses: docker/build-push-action@v6
        with:
          context: ./back_end/
          file: ./back_end/cart_service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cart_service:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.sha }}
